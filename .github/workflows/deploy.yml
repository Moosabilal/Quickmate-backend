name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Safety Check)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Test Build
        run: npm run build

      # - name: Run Tests
      #   run: npm test
